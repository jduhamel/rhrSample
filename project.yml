name: rhrApp
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.example.rhrApp
    SWIFT_VERSION: "5.0"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0
targets:
  rhrApp:
    type: application
    platform: iOS
    sources:
      - path: rhrApp
    info:
      path: rhrApp/Info.plist
      properties:
        CFBundleDisplayName: rhrApp
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        BGTaskSchedulerPermittedIdentifiers:
          - com.example.rhrApp.hourlyRefresh
        UIBackgroundModes:
          - fetch
          - processing
    entitlements:
      path: rhrApp/rhrApp.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.background-modes:
          - fetch
          - processing
    settings:
      base:
        INFOPLIST_KEY_NSHealthShareUsageDescription: Reads your sleep and heart-rate data to compute morning resting metrics.
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: Does not write Health data.
        DEVELOPMENT_ASSET_PATHS: "\"rhrApp/Preview Content\""
    scheme:
      testTargets: []
